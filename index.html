<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Slicer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f1f5f9;
      --surface: #ffffff;
      --border: #e2e8f0;
      --border-hover: #cbd5e1;
      --text: #1e293b;
      --muted: #64748b;
      --red: #ef4444;
      --blue: #3b82f6;
      --blue-hover: #2563eb;
      --radius: 12px;
      --shadow: 0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.05);
      --shadow-md: 0 4px 12px rgba(0,0,0,.1);
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      padding: 24px;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }
    .header-icon { font-size: 2rem; line-height: 1; }
    .header h1   { font-size: 1.625rem; font-weight: 700; }
    .header p    { color: var(--muted); font-size: 0.8125rem; margin-top: 3px; }

    /* ── Upload zone ── */
    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 72px 32px;
      text-align: center;
      cursor: pointer;
      background: var(--surface);
      transition: border-color .15s, background .15s;
    }
    .upload-zone:hover,
    .upload-zone.drag-over {
      border-color: var(--blue);
      background: #eff6ff;
    }
    .upload-zone .icon { font-size: 3.5rem; margin-bottom: 20px; display: block; }
    .upload-zone h2   { font-size: 1.125rem; font-weight: 600; margin-bottom: 8px; }
    .upload-zone p    { color: var(--muted); font-size: 0.875rem; margin-bottom: 20px; }
    .upload-cta {
      display: inline-block;
      border: 2px solid var(--blue);
      color: var(--blue);
      border-radius: 99px;
      padding: 10px 28px;
      font-weight: 600;
      font-size: 0.9375rem;
      cursor: pointer;
      transition: background .15s, color .15s;
      background: transparent;
    }
    .upload-zone:hover .upload-cta,
    .upload-zone.drag-over .upload-cta {
      background: var(--blue);
      color: #fff;
    }

    /* ── Editor ── */
    .editor { display: none; flex-direction: column; gap: 14px; }
    .editor.visible { display: flex; }

    /* ── Toolbar ── */
    .toolbar {
      position: sticky;
      top: 12px;
      z-index: 50;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
      box-shadow: var(--shadow-md);
    }
    .toolbar .info {
      font-size: 0.875rem;
      color: var(--muted);
      margin-right: auto;
      min-width: 120px;
    }
    .toolbar .info strong { color: var(--blue); }

    .toolbar-sep {
      width: 1px;
      height: 24px;
      background: var(--border);
      flex-shrink: 0;
      margin: 0 2px;
    }

    button {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 7px 13px;
      border: none;
      border-radius: 8px;
      font-size: 0.8125rem;
      font-weight: 500;
      cursor: pointer;
      transition: background .12s, color .12s, opacity .12s;
      white-space: nowrap;
      line-height: 1.4;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .btn-ghost {
      background: var(--surface);
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { background: #e2e8f0; color: var(--text); border-color: var(--border-hover); }

    .btn-blue { background: var(--blue); color: #fff; border: 1px solid transparent; }
    .btn-blue:hover:not(:disabled) { background: var(--blue-hover); }

    .btn-ghost-secondary {
      background: var(--surface);
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .btn-ghost-secondary:hover { background: #e2e8f0; color: var(--text); }

    .spinner {
      width: 14px; height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .exporting { display: none; align-items: center; gap: 6px; font-size: 0.8125rem; color: var(--muted); }
    .exporting.visible { display: flex; }

    /* Inline warning */
    .warn-banner {
      display: none;
      align-items: center;
      gap: 8px;
      background: #fef3c7;
      border: 1px solid #f59e0b;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.8125rem;
      color: #92400e;
      width: 100%;
      margin-top: 4px;
    }
    .warn-banner.visible { display: flex; }

    /* ── Hint ── */
    .hint {
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
    }

    /* ── Image scroll area ── */
    .image-scroll {
      max-height: 76vh;
      overflow-y: auto;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-md);
      background: #1e293b;
      scrollbar-width: thin;
      scrollbar-color: #475569 transparent;
      width: fit-content;
      margin: 0 auto;
      padding: 12px;
    }

    .image-wrapper {
      position: relative;
      width: 450px;
      max-width: calc(100vw - 96px);
      user-select: none;
      cursor: crosshair;
      border-radius: 4px;
      overflow: hidden;
    }

    .image-wrapper img {
      display: block;
      width: 100%;
      height: auto;
      pointer-events: none;
    }

    /* ── Slice lines ── */
    .slice-line {
      position: absolute;
      left: 0;
      right: 0;
      z-index: 20;
      transform: translateY(-50%);
      cursor: ns-resize;
      touch-action: none;
    }
    .slice-line::before {
      content: '';
      position: absolute;
      inset: -14px 0;
    }

    .line-bar {
      height: 3px;
      background: var(--red);
      box-shadow: 0 0 0 1px rgba(239,68,68,.25), 0 2px 8px rgba(239,68,68,.4);
      position: relative;
      transition: height .1s, box-shadow .1s;
    }
    .slice-line:hover .line-bar,
    .slice-line.dragging .line-bar {
      height: 5px;
      box-shadow: 0 0 0 2px rgba(239,68,68,.45), 0 3px 14px rgba(239,68,68,.55);
    }

    /* Left-anchored number badge */
    .line-num {
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 26px;
      height: 26px;
      border-radius: 0 50% 50% 0;
      background: var(--red);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      box-shadow: var(--shadow);
    }

    .del-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--red);
      color: #fff;
      border: 2px solid #fff;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      line-height: 1;
      box-shadow: var(--shadow);
      opacity: 0;
      transition: opacity .15s;
      z-index: 30;
    }
    .slice-line:hover .del-btn { opacity: 1; }
  </style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="header-icon">✂️</div>
    <div>
      <h1>Email Slicer</h1>
      <p>Chop Canva email exports into ready-to-send slices</p>
    </div>
  </div>

  <!-- Upload -->
  <div class="upload-zone" id="uploadZone">
    <span class="icon">🖼️</span>
    <h2>Drop your image here</h2>
    <p>PNG, JPG, WebP supported</p>
    <span class="upload-cta">Choose file</span>
    <input type="file" id="fileInput" accept="image/*" style="display:none">
  </div>

  <!-- Editor -->
  <div class="editor" id="editor">

    <div class="toolbar">
      <span class="info" id="sliceInfo">—</span>
      <button class="btn-ghost" id="autoBtn">🔍 Auto-detect</button>
      <button class="btn-ghost" id="addBtn">＋ Add slice</button>
      <button class="btn-ghost" id="clearBtn">✕ Clear all</button>
      <div class="toolbar-sep"></div>
      <div class="exporting" id="exportingEl"><div class="spinner"></div> Exporting…</div>
      <button class="btn-blue" id="exportBtn">⬇ Export ZIP</button>
      <button class="btn-ghost-secondary" id="swapBtn">↩ Swap image</button>
      <div class="warn-banner" id="warnBanner">⚠️ Add at least one slice line before exporting.</div>
    </div>

    <p class="hint">Click the image to add a slice · drag lines to reposition</p>

    <div class="image-scroll" id="imageScroll">
      <div class="image-wrapper" id="imageWrapper">
        <img id="preview" src="" alt="preview">
      </div>
    </div>

  </div>

</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.5.0/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<script>
  let imageEl      = null;
  let sourceFile   = '';     // original filename (no extension) for ZIP naming
  let sliceLines   = [];
  let dragState    = null;

  const uploadZone  = document.getElementById('uploadZone');
  const fileInput   = document.getElementById('fileInput');
  const editor      = document.getElementById('editor');
  const imageWrapper= document.getElementById('imageWrapper');
  const preview     = document.getElementById('preview');
  const imageScroll = document.getElementById('imageScroll');
  const sliceInfo   = document.getElementById('sliceInfo');
  const exportingEl = document.getElementById('exportingEl');
  const exportBtn   = document.getElementById('exportBtn');
  const warnBanner  = document.getElementById('warnBanner');

  // ── Upload ────────────────────────────────────────────────────────────────
  uploadZone.addEventListener('click', () => fileInput.click());
  uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('drag-over'); });
  uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('drag-over'));
  uploadZone.addEventListener('drop', e => {
    e.preventDefault(); uploadZone.classList.remove('drag-over');
    const f = e.dataTransfer.files[0];
    if (f && f.type.startsWith('image/')) loadFile(f);
  });
  fileInput.addEventListener('change', e => { if (e.target.files[0]) loadFile(e.target.files[0]); });

  document.getElementById('swapBtn').addEventListener('click', () => {
    if (sliceLines.length > 0 && !confirm('This will clear your current slice lines. Continue?')) return;
    fileInput.click();
  });

  function loadFile(file) {
    sourceFile = file.name.replace(/\.[^.]+$/, '');
    const url  = URL.createObjectURL(file);
    const img  = new Image();
    img.onload = () => {
      imageEl = img;
      preview.src = url;
      uploadZone.style.display = 'none';
      editor.classList.add('visible');
      sliceLines = [
        Math.round(img.naturalHeight / 3),
        Math.round(img.naturalHeight * 2 / 3),
      ];
      renderLines();
      updateInfo();
    };
    img.src = url;
  }

  // ── Render lines ──────────────────────────────────────────────────────────
  function renderLines() {
    imageWrapper.querySelectorAll('.slice-line').forEach(el => el.remove());
    sliceLines.sort((a, b) => a - b);

    sliceLines.forEach((y, i) => {
      const div = document.createElement('div');
      div.className = 'slice-line';
      div.dataset.index = i;
      div.style.top = pct(y) + '%';

      div.innerHTML = `
        <div class="line-bar">
          <div class="line-num">${i + 1}</div>
          <button class="del-btn" data-index="${i}" title="Remove">×</button>
        </div>`;

      div.addEventListener('pointerdown', startDrag);
      div.querySelector('.del-btn').addEventListener('click', e => {
        e.stopPropagation();
        sliceLines.splice(+e.currentTarget.dataset.index, 1);
        renderLines(); updateInfo();
      });

      imageWrapper.appendChild(div);
    });
  }

  function pct(y) { return (y / imageEl.naturalHeight * 100).toFixed(4); }

  function updateInfo() {
    const n = sliceLines.length;
    sliceInfo.innerHTML = `<strong>${n}</strong> slice${n !== 1 ? 's' : ''} → <strong>${n + 1}</strong> piece${n !== 0 ? 's' : ''}`;
    warnBanner.classList.toggle('visible', n === 0);
  }

  // ── Click image to add slice ───────────────────────────────────────────────
  imageWrapper.addEventListener('click', e => {
    if (dragState) return;
    if (e.target.closest('.slice-line')) return;

    const rect = imageWrapper.getBoundingClientRect();
    // getBoundingClientRect() is already viewport-relative; no scroll adjustment needed
    const yPx  = e.clientY - rect.top;
    const yNat = Math.round(yPx / imageWrapper.offsetHeight * imageEl.naturalHeight);
    sliceLines.push(Math.max(1, Math.min(imageEl.naturalHeight - 1, yNat)));
    renderLines(); updateInfo();
  });

  // ── Drag ─────────────────────────────────────────────────────────────────
  function startDrag(e) {
    if (e.target.closest('.del-btn')) return;
    e.preventDefault(); e.stopPropagation();

    dragState = {
      idx:       +e.currentTarget.dataset.index,
      startY:    e.clientY,
      origLineY: sliceLines[+e.currentTarget.dataset.index],
      displayedH: imageWrapper.offsetHeight,
    };

    document.body.style.cursor = 'ns-resize';
    e.currentTarget.classList.add('dragging');
    e.currentTarget.setPointerCapture(e.pointerId);
    e.currentTarget.addEventListener('pointermove', onDrag);
    e.currentTarget.addEventListener('pointerup', endDrag);
  }

  function onDrag(e) {
    if (!dragState) return;
    const { idx, startY, origLineY, displayedH } = dragState;
    const delta = e.clientY - startY;
    let newY = Math.round(origLineY + delta / displayedH * imageEl.naturalHeight);
    newY = Math.max(1, Math.min(imageEl.naturalHeight - 1, newY));
    sliceLines[idx] = newY;

    const divs = imageWrapper.querySelectorAll('.slice-line');
    if (divs[idx]) divs[idx].style.top = pct(newY) + '%';

    // Auto-scroll when near edges of the scroll container
    const scrollRect = imageScroll.getBoundingClientRect();
    const EDGE = 60;
    if (e.clientY < scrollRect.top + EDGE) {
      imageScroll.scrollTop -= (EDGE - (e.clientY - scrollRect.top)) * 0.4;
    } else if (e.clientY > scrollRect.bottom - EDGE) {
      imageScroll.scrollTop += (EDGE - (scrollRect.bottom - e.clientY)) * 0.4;
    }
  }

  function endDrag(e) {
    if (!dragState) return;
    document.body.style.cursor = '';
    e.currentTarget.classList.remove('dragging');
    e.currentTarget.removeEventListener('pointermove', onDrag);
    e.currentTarget.removeEventListener('pointerup', endDrag);
    dragState = null;
    renderLines(); updateInfo();
  }

  // ── Add / Clear ───────────────────────────────────────────────────────────
  document.getElementById('addBtn').addEventListener('click', () => {
    if (!imageEl) return;
    const bounds = [0, ...sliceLines.sort((a, b) => a - b), imageEl.naturalHeight];
    let maxGap = 0, maxI = 1;
    for (let i = 1; i < bounds.length; i++) {
      const gap = bounds[i] - bounds[i-1];
      if (gap > maxGap) { maxGap = gap; maxI = i; }
    }
    sliceLines.push(Math.round((bounds[maxI-1] + bounds[maxI]) / 2));
    renderLines(); updateInfo();
  });

  document.getElementById('clearBtn').addEventListener('click', () => {
    sliceLines = []; renderLines(); updateInfo();
  });

  // ── Auto-detect cut points ────────────────────────────────────────────────
  document.getElementById('autoBtn').addEventListener('click', () => {
    if (!imageEl) return;
    const points = detectCutPoints(imageEl);
    if (!points.length) {
      alert('No clear section boundaries found. Try adding slices manually.');
      return;
    }
    sliceLines = points; renderLines(); updateInfo();
  });

  // Detect boundaries between visual zones: photo/graphic ↔ text background ↔ whitespace.
  // Also finds trailing whitespace so you can cut it off the bottom.
  function detectCutPoints(img) {
    const scale = Math.min(1, 800 / img.naturalWidth);
    const w = Math.round(img.naturalWidth * scale);
    const h = Math.round(img.naturalHeight * scale);
    const cvs = document.createElement('canvas');
    cvs.width = w; cvs.height = h;
    const ctx = cvs.getContext('2d');
    ctx.drawImage(img, 0, 0, w, h);
    const { data } = ctx.getImageData(0, 0, w, h);

    // Per-row mean brightness and standard deviation
    const bright = new Float32Array(h);
    const stddev = new Float32Array(h);
    for (let y = 0; y < h; y++) {
      let sum = 0;
      for (let x = 0; x < w; x++) {
        const i = (y * w + x) * 4;
        sum += (data[i] + data[i+1] + data[i+2]) / 3;
      }
      const mean = sum / w;
      bright[y] = mean;
      let sq = 0;
      for (let x = 0; x < w; x++) {
        const i = (y * w + x) * 4;
        const d = (data[i] + data[i+1] + data[i+2]) / 3 - mean;
        sq += d * d;
      }
      stddev[y] = Math.sqrt(sq / w);
    }

    // Smooth both signals to eliminate single-row noise
    const sb = rowSmooth(bright, 7);
    const ss = rowSmooth(stddev, 7);

    // Adaptive thresholds — based on this image's own stddev range
    const maxStd       = Math.max(...ss);
    const IMAGE_STD    = Math.max(12, maxStd * 0.30); // clearly photo/graphic
    const UNIFORM_STD  = Math.max(4,  maxStd * 0.10); // clearly flat/uniform
    const WHITE_BRIGHT = 232;

    // Classify each row:  1=photo/graphic  2=text/content  3=white/near-white
    const cls = new Uint8Array(h);
    for (let y = 0; y < h; y++) {
      if (sb[y] > WHITE_BRIGHT && ss[y] < UNIFORM_STD) cls[y] = 3;
      else if (ss[y] > IMAGE_STD)                       cls[y] = 1;
      else                                               cls[y] = 2;
    }

    // Build zones: consecutive runs of the same class
    const zones = [];
    let zs = 0;
    for (let y = 1; y <= h; y++) {
      if (y === h || cls[y] !== cls[zs]) {
        zones.push({ t: cls[zs], s: zs, e: y });
        zs = y;
      }
    }

    // Merge tiny zones (< 1.5% of height) into their neighbour — removes noise
    const MIN_ZONE = Math.max(4, Math.round(h * 0.015));
    for (let pass = 0; pass < 3; pass++) {
      for (let i = 0; i < zones.length; i++) {
        const z = zones[i];
        if (z.e - z.s < MIN_ZONE) {
          const prev = zones[i - 1], next = zones[i + 1];
          const absorber = prev && (!next || (z.s - prev.s < next.e - z.e)) ? prev : next;
          if (absorber) { absorber.s = Math.min(absorber.s, z.s); absorber.e = Math.max(absorber.e, z.e); zones.splice(i--, 1); }
        }
      }
    }

    const margin  = Math.round(h * 0.025);
    const minDist = Math.round(img.naturalHeight * 0.025);
    const cuts    = [];

    for (let i = 0; i + 1 < zones.length; i++) {
      const curr = zones[i], next = zones[i + 1];
      if (curr.t === next.t) continue;

      // Boundary row in scaled pixels
      const boundary = curr.e;
      if (boundary < margin || boundary > h - margin) continue;

      let cutY;
      if (curr.t === 3) {
        // Current zone is white — cut in its middle so the white is split between slices
        cutY = Math.round((curr.s + curr.e) / 2 / scale);
      } else if (next.t === 3) {
        // Next zone is white — cut at the start of it (end of content)
        cutY = Math.round(boundary / scale);
      } else {
        // Direct photo↔text transition — cut right at the boundary
        cutY = Math.round(boundary / scale);
      }
      cuts.push(cutY);
    }

    // Trailing whitespace: find last non-white row and add a cut there
    let lastContent = 0;
    for (let y = h - 1; y >= margin; y--) {
      if (cls[y] !== 3) { lastContent = y + 1; break; }
    }
    if (lastContent > margin && lastContent < h - margin) {
      const natY = Math.round(lastContent / scale);
      if (!cuts.some(c => Math.abs(c - natY) < minDist)) cuts.push(natY);
    }

    // Sort, deduplicate nearby cuts
    cuts.sort((a, b) => a - b);
    return cuts.filter((v, i, arr) => i === 0 || v - arr[i-1] > minDist);
  }

  function rowSmooth(arr, win) {
    const out = new Float32Array(arr.length);
    for (let i = 0; i < arr.length; i++) {
      let s = 0, c = 0;
      for (let j = Math.max(0, i - win); j <= Math.min(arr.length - 1, i + win); j++) { s += arr[j]; c++; }
      out[i] = s / c;
    }
    return out;
  }

  // ── Export ────────────────────────────────────────────────────────────────
  exportBtn.addEventListener('click', async () => {
    if (!imageEl) return;
    if (sliceLines.length === 0) {
      warnBanner.classList.add('visible');
      return;
    }

    exportBtn.disabled = true;
    exportingEl.classList.add('visible');

    try {
      const sorted  = [0, ...sliceLines.sort((a, b) => a - b), imageEl.naturalHeight];
      const zip     = new JSZip();
      const folder  = zip.folder('email-slices');

      const promises = sorted.slice(0, -1).map((startY, i) => {
        const sliceH = sorted[i+1] - startY;
        const cvs    = document.createElement('canvas');
        cvs.width    = imageEl.naturalWidth;
        cvs.height   = sliceH;
        cvs.getContext('2d').drawImage(imageEl, 0, startY, imageEl.naturalWidth, sliceH, 0, 0, imageEl.naturalWidth, sliceH);

        const num = String(i + 1).padStart(2, '0');
        return new Promise(async resolve => {
          cvs.toBlob(async blob => {
            let fname = `slice-${num}.png`;
            if (blob.size > 400 * 1024) {
              blob  = await compressToJpeg(cvs, blob);
              fname = `slice-${num}.jpg`;
            }
            folder.file(fname, blob);
            resolve();
          }, 'image/png');
        });
      });

      await Promise.all(promises);
      const content = await zip.generateAsync({ type: 'blob' });
      const date    = new Date().toISOString().slice(0, 10);
      saveAs(content, `${sourceFile ? sourceFile + '-' : ''}slices-${date}.zip`);
    } finally {
      exportBtn.disabled = false;
      exportingEl.classList.remove('visible');
    }
  });

  async function compressToJpeg(cvs, fallback) {
    let quality = 0.92, blob = fallback;
    while (blob.size > 400 * 1024 && quality >= 0.68) {
      blob = await new Promise(res => cvs.toBlob(res, 'image/jpeg', quality));
      quality -= 0.04;
    }
    return blob;
  }
</script>
